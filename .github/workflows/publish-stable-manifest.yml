name: Publish Stable update manifest

on:
  workflow_run:
    workflows: ["CI and Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published Stable release tag (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  propose-manifest:
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          [[ "$tag" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download and verify published installer
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stable-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'PeaceEmu-Setup-*.exe' --pattern 'PeaceEmu-Setup-*.exe.sha256' --dir "$RUNNER_TEMP/stable-release"
          installer="$(find "$RUNNER_TEMP/stable-release" -maxdepth 1 -name 'PeaceEmu-Setup-*.exe' -print -quit)"
          checksum="${installer}.sha256"
          test -s "$installer" && test -s "$checksum"
          read -r expected filename < "$checksum"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          [[ "$expected" == "$actual" && "$filename" == "$(basename "$installer")" ]] || { echo "Installer checksum verification failed" >&2; exit 1; }
          version="${TAG#v}"
          [[ "$(basename "$installer")" == "PeaceEmu-Setup-$version.exe" ]] || { echo "Installer name/version mismatch" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$installer")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$installer")" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Create update-manifest pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.artifact.outputs.version }}
          ASSET_NAME: ${{ steps.artifact.outputs.asset_name }}
          ASSET_SIZE: ${{ steps.artifact.outputs.size }}
          ASSET_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          branch="automation/stable-manifest-${TAG}-${GITHUB_RUN_ID}"
          base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/PeaceEmu" --jq '.object.sha')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_sha" >/dev/null

          manifest="$(jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET_NAME" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --argjson size "$ASSET_SIZE" \
            --arg sha "$ASSET_SHA256" \
            '{schema_version:1,version:$version,release_notes_url:$notes,downloads:{"windows-x86_64":{url:$url,size_bytes:$size,sha256:$sha}}}')"
          encoded="$(printf '%s\\n' "$manifest" | base64 -w0)"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/PeaceEmu/update/stable.json?ref=$branch" --jq '.sha')"
          printf '%s' "$encoded" | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/PeaceEmu/update/stable.json" \
            -F "message=chore(release): publish PeaceEmu $VERSION update manifest" \
            -F "content=@-" -f "sha=$current_sha" -f "branch=$branch" >/dev/null
          gh pr create --repo "$GITHUB_REPOSITORY" --base PeaceEmu --head "$branch" \
            --title "chore(release): publish PeaceEmu $VERSION update manifest" \
            --body "Automatically generated after the Stable release workflow. The installer was downloaded from the published GitHub release and its SHA-256 was verified. Merge this PR to publish the update manifest without bypassing branch protection."
