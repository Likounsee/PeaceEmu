[package]
name = "desktop-app"
version = "0.2.3"
description = "Experimental native desktop frontend for PeaceEmu"
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.78"
repository = "https://github.com/Likounsee/PeaceEmu"

# Give the installed process a product name instead of the crate's internal name.
[[bin]]
name = "peaceemu"
path = "src/main.rs"

[build-dependencies]
image = { version = "=0.24.9", default-features = false, features = ["png"] }
winres = "0.1"

[dependencies]
host-app = { version = "0.1.0", path = "../app" }
emulation-core = { version = "0.1.0", path = "../core" }
peaceemu-nes = { version = "0.1.0", git = "https://github.com/Likounsee/PeaceEmu-NES", rev = "ee1a084c7051330be7c70fa3f69a5cc750c69dda", package = "peaceemu-nes" }
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg", "webp"] }
ed25519-dalek = "=2.1.1"
rfd = "=0.14.1"
rodio = { version = "=0.17.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sys-locale = "=0.3.2"
ureq = "=3.1.4"
